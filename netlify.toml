[build]
  command = "npm install --global corepack@0.35.0 && corepack enable && pnpm install --frozen-lockfile && pnpm run validate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.18.0"
  PNPM_VERSION = "11.22.0"

[context.production]
  command = "npm install --global corepack@0.35.0 && corepack enable && pnpm install --frozen-lockfile && pnpm run validate"

[context.deploy-preview]
  command = "npm install --global corepack@0.35.0 && corepack enable && pnpm install --frozen-lockfile && pnpm run validate"

[context.branch-deploy]
  command = "npm install --global corepack@0.35.0 && corepack enable && pnpm install --frozen-lockfile && pnpm run validate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
